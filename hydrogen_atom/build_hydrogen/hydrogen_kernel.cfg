# =====================================================================
# hydrogen_kernel.cfg
# v++ system configuration for hydrogen_radial_kernel
# Platform: xilinx_u55c_gen3x16_xdma_3_202210_1
#
# hydrogen_radial_kernel exposes 3 AXI-master arguments:
#   r_grid, u_wave    (double*[<=8192] — radial grid + wavefunction output)
#   diagnostics       (double*[2]      — [E_nl, <r>_nl])
# All three are tiny (<= 64 KB) compared to the statevector kernel's HBM
# arrays, so each gets exactly one HBM PC -- no 8-way striping needed.
# =====================================================================

[connectivity]
sp=hydrogen_radial_kernel_1.r_grid:HBM[0]
sp=hydrogen_radial_kernel_1.u_wave:HBM[1]
sp=hydrogen_radial_kernel_1.diagnostics:HBM[2]

slr=hydrogen_radial_kernel_1:SLR0

[clock]
# 225 MHz mirrors the conservative starting point used for the sibling
# quantum_fpga_kernel_complex128 build on this platform (see
# build_statevector/alveo_u55c.cfg) -- not yet re-verified against a
# routed timing report for this kernel specifically. The datapath here
# (double-precision divide in the Numerov inner loop) is more
# divide-heavy than the gate kernel, so timing closure should be
# re-checked before trusting this number; drop to 200 MHz first if
# place/route doesn't close.
freqHz=225000000:hydrogen_radial_kernel_1

[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

[advanced]
param=compiler.addOutputTypes=hw_export
misc=solution_name=hydrogen_radial_kernel_solution
